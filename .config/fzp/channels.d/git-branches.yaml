metadata:
  description: Git branches
  requires: [git]

steps:
  - title: branches
    source: git branch --all --format='%(refname:short)' | sort -u
    preview: git log --oneline --color=always -20 {}
    fzf: [--no-sort]
    keys:
      enter: {do: "become:git checkout {}", label: checkout}
      ctrl-r: {do: "become:fzp git-log", label: git log}
