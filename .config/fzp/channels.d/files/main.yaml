metadata:
  description: Project files
  requires: [fd]

source:
  script: ./source.sh
  delimiter: "\t"
  ansi: true

preview:
  command: bat --color=always --style=plain --line-range :120 {2} 2>/dev/null || sed -n '1,120p' {2}

ui:
  header: files
  prompt: "[files]> "

navigation:
  ctrl-r: {channel: git-log, label: git log}

actions:
  enter:
    mode: become
    label: edit
    command: ${EDITOR:-nvim} {2}
  ctrl-y:
    mode: execute-silent
    label: copy path
    command: printf %s {2} | pbcopy
  f3:
    mode: become
    label: paste path
    script: ./paste-path.sh
    args: "{2}"
  ctrl-g:
    mode: raw
    label: grep these files
    # {+f2} is a temporary file listing the paths; grep searches only them.
    command: select-all+become(fzp --scope {+f2} grep)
  alt-i:
    mode: raw
    label: toggle ignored
    command: >-
      transform:[[ $FZF_PROMPT == *+ign* ]] &&
      echo "change-prompt([files]> )+reload(FZP_FILES_INCLUDE_IGNORED=0 $FZP_CHANNEL_DIR/source.sh)" ||
      echo "change-prompt([files+ign]> )+reload(FZP_FILES_INCLUDE_IGNORED=1 $FZP_CHANNEL_DIR/source.sh)"

fzf_options:
  - --tabstop=1
