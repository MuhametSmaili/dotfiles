metadata:
  description: Open lazygit in a floating pane
  group: Git
  requires: [lazygit]
  requires_env: [FZP_PANE_ID, FZP_PANE_CWD]

# tmux 3.8 floating pane; same placement as the yazi launcher.
run: >-
  tmux new-pane -t "$FZP_PANE_ID" -X 5% -Y 5% -x 90% -y 90%
  -c "$FZP_PANE_CWD" -T lazygit lazygit
