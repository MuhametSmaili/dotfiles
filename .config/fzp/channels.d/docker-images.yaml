metadata:
  description: Docker images
  requires: [docker]

steps:
  - title: docker images
    source: docker images --format '{{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}'
    preview: docker inspect {4}
    keys:
      ctrl-o: {do: "become:fzp docker-ps", label: containers}
      ctrl-x: {do: "execute-silent:docker rmi {4}", label: remove image}
