metadata:
  description: SSH hosts
  group: Network
  requires: [ssh]

steps:
  - title: ssh hosts
    source: grep '^Host ' ~/.ssh/config ~/.ssh/config.* 2>/dev/null | awk '{print $2}' | grep -v '*' | sort -u
    preview: ssh -G {} 2>/dev/null | head -20
    keys:
      enter: {do: "become:ssh {}", label: connect}
