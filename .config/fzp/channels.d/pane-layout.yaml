metadata:
  description: Change window layout
  group: pane
  requires_env: [FZP_PANE_ID]

steps:
  - select: layout
    title: Choose window layout
    columns: [name, label]
    show: [label]
    items:
      - {name: tiled, label: Tiled grid}
      - {name: even-horizontal, label: All panes side by side}
      - {name: even-vertical, label: All panes stacked}
      - {name: main-horizontal, label: Main pane above smaller panes}
      - {name: main-vertical, label: Main pane beside smaller panes}

run: tmux select-layout -t "$FZP_PANE_ID" "$FZP_STEP_LAYOUT_NAME"
