metadata:
  description: Running docker containers
  requires: [docker]

steps:
  - title: docker containers
    source: docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
    preview: docker inspect {1}
    keys:
      ctrl-o: {do: "become:fzp docker-images", label: images}
      ctrl-l: {do: "become:docker logs --tail 100 -f {1}", label: logs}
      ctrl-e: {do: "become:docker exec -it {1} sh", label: exec sh}
      ctrl-r: {do: "execute-silent:docker restart {1}", label: restart}
