metadata:
  description: Create a worktree and open a shell
  group: Git
  requires: [git]
  requires_env: [FZP_PANE_ID, FZP_SESSION_ID]

steps:
  - select: branch
    title: New scratch branch, or a local branch without a worktree
    columns: [name, info]
    items:
      - {name: "<scratch>", info: "New scratch branch try/<date> from HEAD"}
    source: >-
      git for-each-ref --format='%(refname:short)%09%(worktreepath)%09%(committerdate:relative)  %(subject)' refs/heads
      | awk -F '\t' '$2 == "" { print $1 "\t" $3 }'

  - select: place
    title: Open shell in…
    columns: [kind, focus, label]
    show: [label]
    items:
      - {kind: window, focus: "true", label: New window and focus}
      - {kind: horizontal, focus: "true", label: Split side by side and focus}
      - {kind: vertical, focus: "true", label: Split stacked and focus}
      - {kind: window, focus: "false", label: New window (in background)}
      - {kind: horizontal, focus: "false", label: Split side by side (keep focus)}
      - {kind: vertical, focus: "false", label: Split stacked (keep focus)}

# Worktrees go next to the main checkout: ../<repo>-worktrees/<branch>.
run: |
  set -euo pipefail
  common=$(git rev-parse --path-format=absolute --git-common-dir)
  main=${common%/.git}

  if [[ "$FZP_STEP_BRANCH_NAME" == "<scratch>" ]]; then
    branch="try/$(date +%Y%m%d-%H%M%S)"
    new=(-b "$branch")
    start=HEAD
  else
    branch=$FZP_STEP_BRANCH_NAME
    new=()
    start=$branch
  fi

  path="$(dirname "$main")/$(basename "$main")-worktrees/$(printf %s "$branch" | tr -c 'A-Za-z0-9._-' -)"
  # ${new[@]+...}: bash 3.2 treats an empty array as unset under set -u.
  git worktree add ${new[@]+"${new[@]}"} "$path" "$start"
  "$FZP_CONFIG_DIR/lib/open-shell.sh" "$path" "$branch"
