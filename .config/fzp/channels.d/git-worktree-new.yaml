metadata:
  description: Create a worktree and open a shell
  group: pane
  target: required
  requires: [git]

steps:
  - select: branch
    title: New scratch branch, unused local branch or remote branch
    items:
      - {id: scratch, label: "New scratch branch (try/<date>) from this pane's HEAD"}
    source:
      builtin: git.branches
      with: {exclude_checked_out: true, exclude_shadowed_remotes: true}

  - select: place
    title: Open shell in…
    items:
      - {id: window-focus, label: New window and focus, kind: window, focus: true}
      - {id: horizontal-focus, label: Split side by side and focus, kind: horizontal, focus: true}
      - {id: vertical-focus, label: Split stacked and focus, kind: vertical, focus: true}
      - {id: window, label: New window (in background), kind: window, focus: false}
      - {id: horizontal, label: Split side by side (keep focus), kind: horizontal, focus: false}
      - {id: vertical, label: Split stacked (keep focus), kind: vertical, focus: false}

run:
  # Worktrees go next to the main checkout: ../<repo>-worktrees/<branch>.
  command: |
    set -euo pipefail
    common=$(git rev-parse --path-format=absolute --git-common-dir)
    main=${common%/.git}

    if [[ "$FZP_STEP_BRANCH_ID" == scratch ]]; then
      branch="try/$(date +%Y%m%d-%H%M%S)"
      add=(-b "$branch")
      start=HEAD
    elif [[ -n "$FZP_STEP_BRANCH_REMOTE" ]]; then
      branch=$FZP_STEP_BRANCH_BRANCH
      add=(--track -b "$branch")
      start=$FZP_STEP_BRANCH_REF
    else
      branch=$FZP_STEP_BRANCH_BRANCH
      add=()
      start=$branch
    fi

    # ${add[@]+...}: bash 3.2 treats an empty array as unset under set -u.
    path="$(dirname "$main")/$(basename "$main")-worktrees/$(printf %s "$branch" | tr -c 'A-Za-z0-9._-' -)"
    git worktree add ${add[@]+"${add[@]}"} "$path" "$start"
    "$FZP_CONFIG_DIR/lib/open-shell.sh" "$path" "$branch"
