metadata:
  description: Git commit log
  group: Git
  requires: [git]

steps:
  - title: git log
    source: git log --oneline --all --decorate --color=always -200
    preview: git show --stat --color=always {1}
    preview_window: right:60%
    fzf: [--ansi, --no-sort, --delimiter, " "]
    keys:
      enter: {do: "become:git show {1}", label: show}
      f2: {do: 'execute-silent:printf %s {1} | "$FZP_CONFIG_DIR/lib/copy.sh"', label: copy sha}
      ctrl-o: {do: "become:fzp files", label: files}
      ctrl-t: {do: "become:fzp git-branches", label: branches}
