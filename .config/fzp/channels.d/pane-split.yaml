metadata:
  description: Split pane with a new shell
  group: Tmux
  requires_env: [FZP_PANE_ID, FZP_PANE_CWD]

steps:
  - select: layout
    title: Choose split direction
    columns: [flag, label]
    show: [label]
    items:
      - {flag: -h, label: Side by side}
      - {flag: -v, label: Stacked}

run: tmux split-window "$FZP_STEP_LAYOUT_FLAG" -t "$FZP_PANE_ID" -c "$FZP_PANE_CWD"
