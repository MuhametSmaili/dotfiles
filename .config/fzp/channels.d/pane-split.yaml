metadata:
  description: Split pane with a new shell
  group: pane
  target: required

steps:
  - select: layout
    title: Choose split direction
    items:
      - {id: horizontal, label: Side by side, flag: -h}
      - {id: vertical, label: Stacked, flag: -v}

run:
  command: tmux split-window "$FZP_STEP_LAYOUT_FLAG" -t "$FZP_PANE_ID" -c "$FZP_PANE_CWD"
