metadata:
  description: Copy a Git commit hash
  group: pane
  target: required
  requires: [git]

steps:
  - select: commit
    title: Choose a commit · latest 1,000 on this branch
    source:
      builtin: git.commits
    preview:
      command: git show --stat --color=always {id}

run:
  # -w also sets the system clipboard via OSC 52 (set-clipboard on).
  command: tmux set-buffer -w "$FZP_STEP_COMMIT_HASH"
