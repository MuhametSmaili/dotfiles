metadata:
  description: Environment variables

steps:
  - title: env
    source: env | sort | sed 's/=/\t/'
    columns: [name, value]
    preview: printf '%s\n' {2}
    preview_window: right:40%
    keys:
      f2: {do: 'execute-silent:printf %s {2} | "$FZP_CONFIG_DIR/lib/copy.sh"', label: copy value}
