# Floating panes (tmux 3.8).
#   prefix H/J/K/L       resize, floats clamped to the window
#   prefix Space <key>   float / tile / focus               (table: float)
#   prefix g <key>       move: built-in snaps + hjkl nudge  (table: move)
#
# The bindings at the bottom read like plain commands. All the format math
# lives in the HELPERS block; read a helper with #{E:@name}.

#### HELPERS ###############################################
# Outer box of the current pane, border included (1 cell, 0 with -B none).
# move-pane -X/-Y and resize-pane -x/-y work on this outer box.
set -g @fb '#{?#{==:#{pane-border-lines},none},0,1}'
set -g @fx '#{e|-:#{pane_left},#{E:@fb}}'
set -g @fy '#{e|-:#{pane_top},#{E:@fb}}'
set -g @fw '#{e|+:#{pane_width},#{e|*:#{E:@fb},2}}'
set -g @fh '#{e|+:#{pane_height},#{e|*:#{E:@fb},2}}'

# Room left before the float touches the right / bottom window edge
set -g @fx_max '#{e|-:#{window_width},#{E:@fw}}'
set -g @fy_max '#{e|-:#{window_height},#{E:@fh}}'
set -g @fw_max '#{e|-:#{window_width},#{E:@fx}}'
set -g @fh_max '#{e|-:#{window_height},#{E:@fy}}'

# Step per key press for floats (move and resize), in columns / lines
set -g @step_x 5
set -g @step_y 2

# Next position, one step, clamped to the window
set -g @nudge_left  '#{?#{e|>:#{E:@fx},#{@step_x}},#{e|-:#{E:@fx},#{@step_x}},0}'
set -g @nudge_right '#{?#{e|<:#{e|+:#{E:@fx},#{@step_x}},#{E:@fx_max}},#{e|+:#{E:@fx},#{@step_x}},#{E:@fx_max}}'
set -g @nudge_up    '#{?#{e|>:#{E:@fy},#{@step_y}},#{e|-:#{E:@fy},#{@step_y}},0}'
set -g @nudge_down  '#{?#{e|<:#{e|+:#{E:@fy},#{@step_y}},#{E:@fy_max}},#{e|+:#{E:@fy},#{@step_y}},#{E:@fy_max}}'

# Next size, one step, min 20x5, max up to the window edge
set -g @shrink_w '#{?#{e|>:#{e|-:#{E:@fw},#{@step_x}},20},#{e|-:#{E:@fw},#{@step_x}},20}'
set -g @grow_w   '#{?#{e|<:#{e|+:#{E:@fw},#{@step_x}},#{E:@fw_max}},#{e|+:#{E:@fw},#{@step_x}},#{E:@fw_max}}'
set -g @shrink_h '#{?#{e|>:#{e|-:#{E:@fh},#{@step_y}},5},#{e|-:#{E:@fh},#{@step_y}},5}'
set -g @grow_h   '#{?#{e|<:#{e|+:#{E:@fh},#{@step_y}},#{E:@fh_max}},#{e|+:#{E:@fh},#{@step_y}},#{E:@fh_max}}'

# Floats have pane_z 0..n-1 (0 = front). P: loops over panes in the window.
set -g @has_float   '#{P:#{?pane_floating_flag,1,}}'
set -g @front_float '#{P:#{?#{&&:#{pane_floating_flag},#{==:#{pane_z},0}},#{pane_id},}}'

#### FLOAT TABLE: prefix Space <key> #######################
bind -N "Floating pane actions (prefix Space ? for keys)" Space switch-client -T float

# join-pane needs -s: without it tmux takes the marked pane (prefix m)
bind -N "Toggle float/tile"     -T float Space if -F "#{pane_floating_flag}" { run -C 'join-pane -s #{pane_id}' } { break-pane -W }
bind -N "Float current pane"    -T float f     if -F "#{pane_floating_flag}" {} { break-pane -W }
bind -N "Tile floating pane"    -T float j     if -F "#{pane_floating_flag}" { run -C 'join-pane -s #{pane_id}' }
bind -N "Kill current pane"     -T float x     kill-pane

# On a float jump back; on a tiled pane jump to the front float
bind -N "Focus front float / back" -T float o if -F "#{pane_floating_flag}" { last-pane } {
    if -F "#{E:@has_float}" {
        run -C 'select-pane -t #{E:@front_float}'
    } {
        display-message "No floating pane"
    }
}

bind -N "List float keys" -T float ? list-keys -N -T float

#### RESIZE: prefix H/J/K/L ################################
# Tiled panes resize normally. On a float, resize-pane -L/-R/-U/-D has no
# limit, so set a clamped absolute size instead. -r: H H H repeats.
bind -N "Resize left / shrink float"  -r H if -F "#{pane_floating_flag}" { run -C 'resize-pane -x #{E:@shrink_w}' } { resize-pane -L 5 }
bind -N "Resize down / grow float"    -r J if -F "#{pane_floating_flag}" { run -C 'resize-pane -y #{E:@grow_h}' }   { resize-pane -D 5 }
bind -N "Resize up / shrink float"    -r K if -F "#{pane_floating_flag}" { run -C 'resize-pane -y #{E:@shrink_h}' } { resize-pane -U 5 }
bind -N "Resize right / grow float"   -r L if -F "#{pane_floating_flag}" { run -C 'resize-pane -x #{E:@grow_w}' }   { resize-pane -R 5 }

#### MOVE TABLE: prefix g <key> ############################
# Built-in: arrows / 1-4 snap to edges and corners, 0 fills, M-<key> halves.
# Added: hjkl nudge. -r keeps the table active, so g l l l walks right.
bind -N "Nudge float left"  -T move -r h if -F "#{pane_floating_flag}" { run -C 'move-pane -X #{E:@nudge_left}' }
bind -N "Nudge float down"  -T move -r j if -F "#{pane_floating_flag}" { run -C 'move-pane -Y #{E:@nudge_down}' }
bind -N "Nudge float up"    -T move -r k if -F "#{pane_floating_flag}" { run -C 'move-pane -Y #{E:@nudge_up}' }
bind -N "Nudge float right" -T move -r l if -F "#{pane_floating_flag}" { run -C 'move-pane -X #{E:@nudge_right}' }
