# Core options: prefix, terminal capabilities, general behaviour.

#### PREFIX ################################################
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#### TERMINAL ##############################################
set -g extended-keys on                # Shift+Enter, Ctrl+Enter reach apps
set -g extended-keys-format csi-u
set -g set-clipboard on                # OSC52, works over SSH
set -g allow-passthrough on            # image previews (yazi)
set -g focus-events on                 # vim autoread
set -g escape-time 0

# Ghostty is detected automatically (RGB, extkeys, sync, ...); this only
# helps terminals reporting xterm-256color. Fixed index, no -a, so a reload
# overwrites the slot instead of appending. 90 stays clear of tmux's defaults.
set -s terminal-features[90] 'xterm-256color:RGB:usstyle'

#### BEHAVIOUR #############################################
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -g display-time 4000               # messages stay 4s
set -g aggressive-resize on
set -g detach-on-destroy off           # killing a session jumps to the next one
