# Launcher: prefix o <key>. Tools open as floating panes and close on exit,
# so prefix Space / prefix g work on them.
#
# Placement: full-screen tools are borderless at 0,0; the rest are centred
# with X = (100% - width) / 2. Always pass -X/-Y, otherwise tmux cascades
# floats from the top-left and large ones spill off the screen.

bind -N "Launcher (prefix o ? for keys)" o switch-client -T launch

#### POPUPS (switch session, so they must not live in a window) ####
# Ghostty: cmd+p -> C-a o o, cmd+k -> C-a u
bind -N "Session switcher (hetki)" -T launch o display-popup -B -E -w 80% -h 80% "hetki"
# fzp pane actions (~/.config/fzp/channels.d, metadata.group: pane). run-shell
# -C expands #{pane_id}; --client lets flows switch this client's session.
bind -N "Pane actions (fzp)" u run-shell -C 'display-popup -B -E -w 80% -h 80% -c #{q:client_name} -d #{q:pane_current_path} "fzp --target #{pane_id} --client #{q:client_name} --group pane"'

#### FLOATING PANES ########################################
bind -N "New floating shell" -T launch n new-pane -X 20% -Y 20% -x 60% -y 60% -c "#{pane_current_path}"
bind -N "Yazi"               -T launch y new-pane -X 10% -Y 10% -x 80% -y 80% -c "#{pane_current_path}" -T yazi "yazi"
bind -N "CodeDiff"           -T launch g new-pane -B none -X 0 -Y 0 -x 100% -y 100% -c "#{pane_current_path}" -T codediff "zsh -i -c cdf"
bind -N "Sofka (kube)"       -T launch s new-pane -B none -X 0 -Y 0 -x 100% -y 100% -T sofka "sofka"

# --target tells fzp which pane to paste the picked path into
bind -N "File finder" -T launch f run-shell -C 'new-pane -X 20% -Y 20% -x 60% -y 60% -c #{q:pane_current_path} -e FZP_HEIGHT=100% -T files "fzp --target #{pane_id} files"'

bind -N "List launcher keys" -T launch ? list-keys -N -T launch
