# Colours and status bar. Palette matches the Ghostty "Merino Dark" theme.

#### PALETTE (Merino / GitHub Dark) ########################
# Named by role, so a format string says what it paints.
set -g @thm_bg         "default"
set -g @thm_fg         "default"
set -g @thm_accent     "#58a6ff"   # current window, active pane border
set -g @thm_dark       "#0d1117"   # text on coloured blocks
set -g @thm_surface    "#21262d"   # inactive window tabs
set -g @thm_border     "#484f58"   # inactive pane border
set -g @thm_separator  "#3a3a4a"   # line between window tabs
set -g @thm_green      "#3fb950"   # cpu / ram: low
set -g @thm_yellow     "#d29922"   # cpu / ram: medium
set -g @thm_red        "#ff7b72"   # cpu / ram: high
set -g @thm_cyan       "#39c5cf"   # session name
set -g @thm_light_blue "#79c0ff"   # kube context

#### POPUPS & BORDERS ######################################
# tmux 3.8 paints menus, messages, copy-mode selection etc. with "theme*"
# colours (themeyellow, themedarkgrey, ...). The theme option decides where
# those come from: tmux's built-in palette, or Ghostty's ANSI colours.
set -g theme detect

# tmux 3.8 ships coloured popup defaults; use the terminal's instead
set -g popup-style default
set -g popup-border-style default
set -g pane-border-style        "fg=#{@thm_border}"
set -g pane-active-border-style "fg=#{@thm_accent}"

#### WINDOW TABS ###########################################
# tmux 3.8 underlines the current window by default; turn that off
setw -g window-status-current-style default
setw -g window-status-format         "#[bg=#{@thm_surface},fg=#{@thm_fg}] #I:#W#{?window_zoomed_flag, 󰊓,} #[default]"
setw -g window-status-current-format "#[bg=#{@thm_accent},fg=#{@thm_dark},bold] #I:#W#{?window_zoomed_flag, 󰊓,} #[default]"
setw -g window-status-separator      "#[fg=#{@thm_separator}]│#[default]"

#### STATUS BAR ############################################
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-interval 5
set -g status-left ""
set -g status-right-length 200

# tmux-cpu colours
set -g @cpu_low_bg_color    "#[bg=#{@thm_green}]"
set -g @cpu_medium_bg_color "#[bg=#{@thm_yellow}]"
set -g @cpu_high_bg_color   "#[bg=#{@thm_red}]"
set -g @ram_low_bg_color    "#[bg=#{@thm_green}]"
set -g @ram_medium_bg_color "#[bg=#{@thm_yellow}]"
set -g @ram_high_bg_color   "#[bg=#{@thm_red}]"

# First line has no -a, so a reload resets status-right instead of appending
set -g  status-right '#{cpu_bg_color} #[fg=#{@thm_dark}]󰻠 #{cpu_percentage} #[default]'
set -ag status-right ' #{ram_bg_color} #[fg=#{@thm_dark}]󰍛 #{ram_percentage} #[default]'
set -ag status-right ' #[bg=#{@thm_cyan}] #[fg=#{@thm_dark}]󰲋 #S #[default]'
if-shell '[ -x "$(command -v kubectl)" ] && [ -n "$(kubectl config current-context 2>/dev/null)" ]' \
    "set -ag status-right '#[bg=default] #[bg=#{@thm_light_blue}] #[fg=#{@thm_dark}]☸ #(kubectl config current-context) '"
