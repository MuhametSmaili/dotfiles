#### CORE SETTINGS #########################################
# Use Ctrl-A as prefix (instead of Ctrl-B)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows & panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# True-color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"
set -as terminal-features ",xterm-256color:RGB:usstyle"

# Clipboard (OSC52 over SSH)
set-option -g set-clipboard on

# Allow passthrough escape sequences (needed for Ghostty OSC 9;4 progress)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Aggressive pane resizing (better layout when one pane changes)
set -g aggressive-resize on

# Enable modified key combinations (for example Shift+Enter) in applications
set -g extended-keys on
set -g extended-keys-format csi-u

# Faster escape
set -g escape-time 0

# Bigger scrollback buffer
set -g history-limit 50000

# Let vim detect focus changes (autoread)
set -g focus-events on

# Renumber windows when one is closed
set -g renumber-windows on

# Switch to next session instead of detaching when killing a session
set -g detach-on-destroy off

#### PLUGINS #######################################
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tpm'

#### Popup window ######################################
bind -N "Session switcher popup" o display-popup -B -E -w 80% -h 80% "hetki" # run custom switcher
bind -N "Open CodeDiff popup" g display-popup -B -E -w 100% -h 100% -d "#{pane_current_path}" "zsh -i -c cdf"
bind -N "File finder popup" f run-shell "tmux set -gq @fzp_target #{pane_id}" \; display-popup -B -E -w 60% -h 60% -d "#{pane_current_path}" -e FZP_HEIGHT=100% "fzp files"
bind y popup -d "#{pane_current_path}" -E -w 80% -h 80% -T "yazi" "yazi"


#### KEY BINDINGS #########################################
# Pane resizing with Shift+H/L (5 cells)
bind -N "Resize pane left" -r H resize-pane -L 5
bind -N "Resize pane right" -r L resize-pane -R 5
bind -N "Resize pane up" -r K resize-pane -U 5
bind -N "Resize pane down" -r J resize-pane -D 5

# vim bindings for pane navigation
bind -N "Select pane left" h select-pane -L
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -N "Switch to last window" Tab last-window           # prefix + Tab (very intuitive!)
bind -N "Switch to last session" BTab switch-client -l     # prefix + Shift+Tab for last session
bind -N "Rotate panes" C-o rotate-window         # keep tmux default pane rotation on prefix + C-o

# Move windows left/right in status bar (intentional, harder-to-hit keys)
unbind C-h
unbind C-l
bind -N "Move window left" -r C-Left  swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -r C-Right swap-window -t +1 \; select-window -t +1

# Resize equally
bind -N "Balance pane sizes" = select-layout -E

# Switch layouts
bind -N "Layout even-horizontal" | select-layout even-horizontal
bind -N "Layout even-vertical" _ select-layout even-vertical

# Disable next-layout
unbind Space

# toggle status bar
bind-key -N "Toggle status bar" c-s set-option status

# Split panes in current path
bind -N "Split vertically" '-' split-window -c "#{pane_current_path}"
bind -N "Split horizontally" % split-window -h -c "#{pane_current_path}"
bind -N "New window here" c new-window     -c "#{pane_current_path}"

# Move current pane to new window
bind -N "Move pane to new window" ! break-pane

# Reload config
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Quick session management
bind -N "Create new session" S command-prompt -p "New session:" "new-session -s '%%'"
bind -N "Kill current session" X confirm-before -p "Kill session #S? (y/n)" kill-session

#### COPY MODE (vi) #######################################
setw -g mode-keys vi
bind -N "Copy mode: start selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Copy mode: yank selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#### THEME #####################################
set -g status-left-length 80
set -g status-right-length 200
set -g status-interval 5
set -g status-left ""
set -g status-right ""

##### Palette (Catppuccin Mocha) ###############################################
set -g @thm_bg        "#1e1e2e"
set -g @thm_fg        "#cdd6f4"
set -g @thm_mauve     "#cba6f7"
set -g @thm_crust     "#11111b"
set -g @thm_surface_0 "#313244"
set -g @thm_green     "#a6e3a1"
set -g @thm_yellow    "#f9e2af"
set -g @thm_red       "#f38ba8"
set -g @thm_sky       "#89dceb"
set -g @thm_rosewater "#f5e0dc"

# Use terminal defaults instead of tmux 3.8's built-in popup colours.
set -g popup-style default
set -g popup-border-style default

##### Window Styling ############################################################
# tmux 3.8 defaults window-status-current-style to "underscore"; turn it off so
# the current window name isn't underlined.
setw -g window-status-current-style default
setw -g window-status-format "#[bg=#{@thm_surface_0},fg=#{@thm_fg}] #I:#W#{?window_zoomed_flag, 󰊓,} #[default]"
setw -g window-status-current-format "#[bg=#{@thm_mauve},fg=#{@thm_crust},bold] #I:#W#{?window_zoomed_flag, 󰊓,} #[default]"
setw -g window-status-separator "#[fg=#3a3a4a]│#[default]"

##### Status Bar ################################################################
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# ##### Pane Borders ##############################################################
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

##### Dynamic CPU & RAM colors ##################################################
set -g @cpu_low_bg_color    "#[bg=#{@thm_green}]"
set -g @cpu_medium_bg_color "#[bg=#{@thm_yellow}]"
set -g @cpu_high_bg_color   "#[bg=#{@thm_red}]"

set -g @ram_low_bg_color    "#[bg=#{@thm_green}]"
set -g @ram_medium_bg_color "#[bg=#{@thm_yellow}]"
set -g @ram_high_bg_color   "#[bg=#{@thm_red}]"

##### Status Right Content ######################################################

set -g status-right '#{cpu_bg_color} #[fg=#{@thm_crust}]󰻠 #{cpu_percentage} #[default]'
set -ag status-right ' #{ram_bg_color} #[fg=#{@thm_crust}]󰍛 #{ram_percentage} #[default]'
set -ag status-right ' #[bg=#{@thm_sky}] #[fg=#{@thm_crust}]󰲋 #S #[default]'
# get current kube context
if-shell '[ -x "$(command -v kubectl)" ] && [ -n "$(kubectl config current-context 2>/dev/null)" ]' \
  "set -ag status-right '#[bg=default] #[bg=#{@thm_rosewater}] #[fg=#{@thm_crust}]☸ #(kubectl config current-context) '"

#### INITIALIZE TPM ########################################
run '~/.config/tmux/plugins/tpm/tpm'
