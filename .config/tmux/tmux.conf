# tmux 3.8+ entry point. Settings live in conf.d/, one file per topic.
#   options   prefix, terminal, behaviour
#   keys      panes, windows, sessions, copy mode
#   launcher  prefix o <key>
#   float     prefix Space <key>, prefix g
#   theme     colours, status bar
# Discover bindings live: prefix ?, prefix o ?, prefix Space ?

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tpm'

source-file -F '#{d:current_file}/conf.d/options.conf'
source-file -F '#{d:current_file}/conf.d/keys.conf'
source-file -F '#{d:current_file}/conf.d/launcher.conf'
source-file -F '#{d:current_file}/conf.d/float.conf'
source-file -F '#{d:current_file}/conf.d/theme.conf'

run '~/.config/tmux/plugins/tpm/tpm'   # keep last
